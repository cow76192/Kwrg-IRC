plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven { url = 'https://repo.hypixel.net/repository/Hypixel/' }
	maven { url = 'https://api.modrinth.com/maven' }
	maven { url = 'https://maven.wispforest.io' }
	maven { url = 'https://jitpack.io' }
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"kwrg" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	compileOnly 'net.hypixel:mod-api:1.0.2'
	include implementation('maven.modrinth:hypixel-mod-api:1.0.2+build.1+mc26.1')
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // 将原本的 modImplementation 改为 implementation
	implementation "io.wispforest:owo-lib:${project.owo_version}"
	annotationProcessor "io.wispforest:owo-lib:${project.owo_version}"

	// include 打包
	include "io.wispforest:owo-sentinel:${project.owo_version}"
	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

def windowHelper = file('src/client/resources/assets/kwrg/window/window-capture.exe')

tasks.register('buildWindowHelper', Exec) {
	inputs.files(fileTree('src/windowNative') { include '**/*.cs', '**/*.ps1' })
	outputs.file(windowHelper)
	// Non-Windows builds reuse a bundled helper; compilation requires Windows WinMetadata.
	onlyIf { System.getProperty('os.name').startsWith('Windows') }
	commandLine 'powershell.exe', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
			'-File', file('src/windowNative/build.ps1').absolutePath, '-CompileOnly'
}

tasks.named('processClientResources') {
	dependsOn tasks.named('buildWindowHelper')
	doFirst {
		if (!windowHelper.isFile() || windowHelper.length() == 0) {
			throw new GradleException('Missing window-capture.exe: build once on Windows and include the helper in the repository.')
		}
	}
}

// Local regression checks are optional and are not distributed with the project.
if (file('gradle/window-checks.gradle').isFile()) {
	apply from: 'gradle/window-checks.gradle'
}

tasks.named('sourcesJar') {
	dependsOn tasks.named('buildWindowHelper')
	from('src/windowNative') { into 'native/window' }
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
