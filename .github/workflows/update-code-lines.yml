name: Update code line badges

on:
  push:
    branches: [master]
    paths:
      - 'src/**/*.java'
      - '.github/scripts/update-code-lines.ps1'
      - '.github/workflows/update-code-lines.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-code-lines
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Count Java source lines and update both READMEs
        shell: pwsh
        run: ./.github/scripts/update-code-lines.ps1
      - name: Commit updated badges
        shell: bash
        run: |
          if git diff --quiet -- README.md README.en.md; then
            echo 'Code line badges are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md README.en.md
          git commit -m 'docs: update code line badges'
          git push
