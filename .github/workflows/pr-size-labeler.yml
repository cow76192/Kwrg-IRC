name: PR Size Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR based on changes
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const totalChanges = pr.additions + pr.deletions;

            const thresholds = [5000, 4000, 2000, 1500, 1000, 800, 400, 200, 100, 40, 10, 1];

            const sizeLabels = thresholds.map(t => `${t}+`);

            const matchedThreshold = thresholds.find(t => totalChanges >= t) ?? thresholds[thresholds.length - 1];
            const targetLabel = `${matchedThreshold}+`;

            const currentLabels = (pr.labels || []).map(l => l.name);

            for (const label of sizeLabels) {
              if (label !== targetLabel && currentLabels.includes(label)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    name: label,
                  });
                } catch (err) {
                  console.log(`Failed to remove label ${label}:`, err.message);
                }
              }
            }

            if (!currentLabels.includes(targetLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [targetLabel],
              });
              console.log(`Successfully added label: ${targetLabel} (Total changes: ${totalChanges})`);
            }